services:
  - type: web
    name: railmark-ai
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_TYPE
        value: memory
      - key: JWT_SECRET
        value: railmark_secure_sih_prototype_jwt_secret_key_2026!
      - key: CORS_ORIGIN
        value: "*"
