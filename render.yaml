services:
  - type: web
    name: railmark-ai
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_TYPE
        value: memory
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
